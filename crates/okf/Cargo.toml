[package]
name = "okf"
description = "The Open Knowledge Format (OKF) v0.2 in pure Rust: the `okf` CLI (validate, lint, inspect, index, graph, format, diff) plus the full okf-core and okf-validator library APIs re-exported."
documentation = "https://docs.rs/okf"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
clap = { workspace = true, optional = true }
okf-core.workspace = true
okf-studio = { workspace = true, optional = true }
okf-validator = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
default = ["validator", "studio"]
# Conformance validation, multi-language syntax checking, and linting:
# the validate, syntax, and lint modules, and the okf validate / okf lint
# subcommands. On by default; opt out with default-features = false for a
# parse-only dependency.
validator = ["dep:okf-validator", "dep:serde_json", "dep:clap"]
# The `okf studio` interactive TUI. On by default for the installed binary;
# opt out with --no-default-features --features validator for a slim build.
studio = ["validator", "dep:okf-studio"]

# The lib target re-exports all of okf-core, so `cargo add okf` keeps working
# as a library dependency (`use okf::Bundle;`) while `cargo install okf` still
# installs the CLI. Dependents only build the lib; the binary costs them
# nothing.
[lib]
name = "okf"
path = "src/lib.rs"

[[bin]]
name = "okf"
path = "src/main.rs"
# The CLI's validate and lint subcommands need the validator, so building the
# binary without it is refused up front rather than failing mid-compile.
required-features = ["validator"]
