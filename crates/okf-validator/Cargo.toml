[package]
name = "okf-validator"
description = "Conformance validation and opinionated linting for Open Knowledge Format (OKF) v0.2 bundles: severity-tagged diagnostics for spec violations and bundle hygiene."
documentation = "https://docs.rs/okf-validator"
readme = "README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
okf-core.workspace = true
oxc_allocator = { version = "0.147.0", optional = true }
oxc_parser = { version = "0.147.0", optional = true }
oxc_span = { version = "0.147.0", optional = true }
rustpython-parser = { version = "0.4.0", optional = true }
serde_json.workspace = true
sqlparser = { version = "0.62.0", optional = true }
syn = { version = "3.0.4", features = ["full"], optional = true }

# The conformance and lint checks need none of the third-party language
# parsers; only the two syntax checks (V24, V25) do. Each parser sits behind a
# feature so that a consumer with a strict dependency or licence policy can
# drop the ones it cannot accept while keeping the rest of the validator.
# JSON, YAML, and Bash checking is built in and always available.
#
# All parsers are on by default, so existing users see no change.
[features]
default = ["python", "javascript", "rust", "sql"]
# Python syntax checking via rustpython-parser. This is by far the largest
# tree (60+ crates) and the only one with copyleft licensing: it pulls in the
# LGPL-3.0-only `malachite` crates, plus `tiny-keccak` (CC0-1.0),
# `unicode_names2` (Unicode-DFS-2016), and several unmaintained `unic-*`
# crates. Disable it under an allow-list licence policy.
python = ["dep:rustpython-parser"]
# JavaScript and TypeScript syntax checking via the oxc parser.
javascript = ["dep:oxc_allocator", "dep:oxc_parser", "dep:oxc_span"]
# Rust syntax checking via syn.
rust = ["dep:syn"]
# SQL syntax checking via sqlparser.
sql = ["dep:sqlparser"]
