[package]
name = "okf-core"
description = "A pure-Rust implementation of the Open Knowledge Format (OKF) v0.2 specification: parser, model, validator, provenance/trust/attestation families, link graph, and index/log tooling."
documentation = "https://docs.rs/okf-core"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

# OKF is, by design, "markdown files with YAML frontmatter", implemented
# with its own YAML-subset parser, markdown link scanner, and directory walker.
[dependencies]

# Path-only (no version), so cargo strips this cycle-free dev-dependency when
# publishing; it exists because the bundle integration tests assert against
# validation output.
[dev-dependencies]
okf-validator = { path = "../okf-validator" }
