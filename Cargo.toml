[workspace]
members = [
    "crates/okf-core",
    "crates/okf-validator",
    "crates/okf",
    "crates/cargo-okf",
    "crates/reserved/*",
]
resolver = "3"

[workspace.package]
version = "0.2.4"
edition = "2024"
authors = ["Walter Higgins <walter.higgins@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/W4G1/okf"
homepage = "https://github.com/W4G1/okf"
keywords = ["okf", "knowledge-base", "markdown", "frontmatter", "agents"]
categories = ["command-line-utilities", "parser-implementations", "data-structures"]

[workspace.dependencies]
okf-core = { path = "crates/okf-core", version = "0.2.4" }
okf-validator = { path = "crates/okf-validator", version = "0.2.4" }
okf = { path = "crates/okf", version = "0.2.4" }
serde_json = "1.0.151"
