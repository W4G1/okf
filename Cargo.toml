[workspace]
members = [
    "crates/okf-core",
    "crates/okf-validator",
    "crates/okf-studio",
    "crates/okf",
    "crates/cargo-okf",
    "crates/reserved/*",
]
resolver = "3"

[workspace.package]
version = "0.2.7"
edition = "2024"
authors = ["Walter van der Giessen <waltervdgiessen@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/W4G1/okf"
homepage = "https://github.com/W4G1/okf"
keywords = ["okf", "knowledge-base", "markdown", "frontmatter", "agents"]
categories = ["command-line-utilities", "parser-implementations", "data-structures"]

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"

[workspace.dependencies]
okf-core = { path = "crates/okf-core", version = "0.2.7" }
# default-features = false so that members can forward the validator's
# language-parser features instead of unconditionally enabling them all.
okf-validator = { path = "crates/okf-validator", version = "0.2.7", default-features = false }
okf-studio = { path = "crates/okf-studio", version = "0.2.7", default-features = false }
okf = { path = "crates/okf", version = "0.2.7" }
serde_json = "1.0.151"
clap = { version = "4.6.6", features = ["derive"] }
ratatui = "0.30.2"
crossterm = "0.29.0"
